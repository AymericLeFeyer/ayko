services:
  core:
    build:
      context: .
      target: core
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      AYKO_MASTER_KEY: ${AYKO_MASTER_KEY:-}
      AYKO_MOCK: ${AYKO_MOCK:-false}
      AYKO_PUBLIC_URL: ${AYKO_PUBLIC_URL:-http://localhost:3100}
      AYKO_LOG_LEVEL: ${AYKO_LOG_LEVEL:-info}
    ports:
      - '3100:3100'
    volumes:
      - ayko-data:/data
    stop_grace_period: 15s

  # Can run on another machine: point AYKO_CORE_URL at Core and start this service alone.
  display:
    build:
      context: .
      target: display
    restart: unless-stopped
    environment:
      AYKO_CORE_URL: ${AYKO_CORE_URL:-http://core:3100}
    ports:
      - '3200:3200'
    depends_on:
      - core

volumes:
  ayko-data:
