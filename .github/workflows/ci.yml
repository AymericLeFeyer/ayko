name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ayko-core .
      - name: Start the image in mock mode and check /health
        run: |
          docker run -d --name ayko -p 3100:3100 -e AYKO_MOCK=true ayko-core
          for attempt in $(seq 1 30); do
            if curl -fs http://localhost:3100/health; then
              curl -fs http://localhost:3100/ | grep -q '<div id="root">'
              exit 0
            fi
            sleep 1
          done
          docker logs ayko
          exit 1
